version: 2

builds:
  - id: specflow
    main: .
    binary: specflow
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/chenquan/specflow/cmd.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  disable: true
